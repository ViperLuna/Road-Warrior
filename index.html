<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Road Warrior</title>
  <meta name="theme-color" content="#16201a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" as="image" href="assets/title.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="hud-top">
      <div id="stats">
        <div class="pill" id="pill-road">Roads <b id="n-road">0</b></div>
        <div id="specials"></div>
        <div class="pill">Trips <b id="n-trips">0</b></div>
        <div class="pill">Cash <b id="n-money">$0</b></div>
      </div>
      <div id="actions">
        <button id="speed-btn" class="chip" type="button" title="Speed (numpad 0 pause, 1, 2, 3)">1x</button>
        <button id="shop-btn" class="chip" type="button">Shop</button>
        <button id="menu-btn" class="chip" type="button">Menu</button>
      </div>
      <div id="goal"><div id="goal-bar"><i></i></div><span id="goal-text"></span></div>
    </div>
    <div id="shop" hidden>
      <div id="shop-head"><b>Shop</b><button id="shop-close" type="button" aria-label="Close shop">Close</button></div>
      <div id="shop-items"></div>
    </div>
    <div id="toast"></div>
    <div id="toolbar">
      <button type="button" data-tool="build" title="Build (1)" class="active">Build</button>
      <button type="button" data-tool="destroy" title="Demolish (2)">Demolish</button>
      <button type="button" data-tool="pan" title="Move (3)">Move</button>
      <button type="button" data-tool="cut" title="Cut (4)">Cut</button>
      <button type="button" data-tool="cone" title="Cone (5)" id="cone-btn">Cone</button>
      <button type="button" id="oneway-btn" title="One-way (6)" hidden>One-way</button>
    </div>
  </div>

  <div class="overlay" id="menu" hidden>
    <h1>Road Warrior</h1>
    <p class="tag">Pick a map</p>
    <div id="map-list"></div>
    <button class="big alt" id="settings-btn" type="button">Settings</button>
    <section id="history" hidden>
      <h3>History</h3>
      <div id="history-text" tabindex="0"></div>
    </section>
  </div>

  <div class="overlay" id="reward" hidden>
    <h2>Goal reached!</h2>
    <p class="tag" id="reward-sub">Choose your reward</p>
    <div id="reward-cards"></div>
  </div>

  <div class="overlay" id="pause" hidden>
    <h2>Paused</h2>
    <div class="stack">
      <button class="big" id="resume" type="button">Resume</button>
      <button class="big alt" id="restart" type="button">New map</button>
      <button class="big alt" id="pause-settings-btn" type="button">Settings</button>
      <button class="big alt" id="to-menu" type="button">Main menu</button>
    </div>
  </div>

  <div class="overlay" id="settings" hidden>
    <h2>Settings</h2>
    <div class="stack">
      <label class="opt"><input type="checkbox" id="opt-cuts"> Show cut markers</label>
      <button class="big" id="settings-close" type="button">Back</button>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <h2>Gridlock!</h2>
    <p class="tag" id="over-sub"></p>
    <div id="over-stats"></div>
    <div class="stack">
      <button class="big" id="again" type="button">Play again</button>
      <button class="big alt" id="over-menu" type="button">Main menu</button>
    </div>
  </div>

  <div id="splash">
    <h1 class="title"><img src="assets/title.jpg" alt="Road Warrior"></h1>
    <p class="tag">Build the roads. Keep the traffic moving.</p>
    <button id="start" type="button">Tap to Start</button>
    <p class="hint">Sound on for the full experience</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
